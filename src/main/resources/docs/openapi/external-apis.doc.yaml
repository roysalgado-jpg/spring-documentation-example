    ErrorRespuesta:
      type: object
      required:
        - codigo
        - mensaje
        - idRastreo
      properties:
        codigo:
          type: string
          description: Código interno, semántico y estable, en español.
          enum:
            - SOLICITUD_INVALIDA
            - NO_AUTORIZADO
            - PROHIBIDO
            - ERROR_INTERNO
          example: SOLICITUD_INVALIDA
        mensaje:
          type: string
          description: Mensaje legible que describe el problema.
          example: La petición contiene parámetros inválidos.
        detalles:
          type: object
          nullable: true
          description: Información adicional para corregir o interpretar la petición.
          additionalProperties:
            type: string
          example:
            empresaId: El parámetro es obligatorio.
        idRastreo:
          type: string
          description: Identificador para correlacionar la respuesta con logs y trazas.
          example: a8f32c91

  responses:
    SolicitudInvalida:
      description: Algún parámetro de la petición es inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRespuesta"
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: La petición contiene parámetros inválidos.
            detalles:
              empresaId: El parámetro es obligatorio.
            idRastreo: a8f32c91
    NoAutorizado:
      description: El token no existe, es inválido o expiró.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRespuesta"
          example:
            codigo: NO_AUTORIZADO
            mensaje: El token no existe, es inválido o expiró.
            idRastreo: a8f32c91
    Prohibido:
      description: El usuario no tiene acceso a la operación.
      content:
