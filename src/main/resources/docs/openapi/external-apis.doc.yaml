          example:
            codigo: PROHIBIDO
            mensaje: El usuario no tiene acceso a la operación.
            idRastreo: a8f32c91
    ErrorInterno:
      description: Ocurrió un error inesperado al procesar la operación. No expone trazas, SQL ni detalles de infraestructura.
      content:
        application/json:
